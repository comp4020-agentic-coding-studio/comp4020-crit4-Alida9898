<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water glasses</title>
    <meta
      name="description"
      content="A rack of glasses you can tap to play and pour to tune. Every note is synthesised in the browser as you touch it."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Water glasses</h1>

      <!--
        The glasses are written out here rather than built by the script, for two
        reasons. A slow or failed load otherwise leaves a blank page with nothing
        to touch, and the spec's checks read the SHIPPED markup, not the DOM after
        hydration.

        role="slider" is not decoration: the water level IS the value, so arrow
        keys are already the right keys and a screen reader already announces the
        right thing. The water heights below are the tuned starting set --- an
        ascending pentatonic run --- and spec/page.test.ts pins them to
        defaultWaterLevels() so this no-script state can't drift into a lie.
      -->
      <div class="rack" id="rack">
        <div
          class="glass"
          data-axis="water"
          data-glass="0"
          role="slider"
          tabindex="0"
          aria-label="Glass 1"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="100"
        >
          <svg class="glass-art" viewBox="0 0 60 170" aria-hidden="true" focusable="false">
            <rect class="water" x="8" y="16" width="44" height="140" rx="2" />
            <rect class="wall" x="6" y="10" width="48" height="150" rx="5" />
          </svg>
        </div>
        <div
          class="glass"
          data-axis="water"
          data-glass="1"
          role="slider"
          tabindex="0"
          aria-label="Glass 2"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="92"
        >
          <svg class="glass-art" viewBox="0 0 60 170" aria-hidden="true" focusable="false">
            <rect class="water" x="8" y="27.7" width="44" height="128.3" rx="2" />
            <rect class="wall" x="6" y="10" width="48" height="150" rx="5" />
          </svg>
        </div>
        <div
          class="glass"
          data-axis="water"
          data-glass="2"
          role="slider"
          tabindex="0"
          aria-label="Glass 3"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="83"
        >
          <svg class="glass-art" viewBox="0 0 60 170" aria-hidden="true" focusable="false">
            <rect class="water" x="8" y="39.4" width="44" height="116.6" rx="2" />
            <rect class="wall" x="6" y="10" width="48" height="150" rx="5" />
          </svg>
        </div>
        <div
          class="glass"
          data-axis="water"
          data-glass="3"
          role="slider"
          tabindex="0"
          aria-label="Glass 4"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="71"
        >
          <svg class="glass-art" viewBox="0 0 60 170" aria-hidden="true" focusable="false">
            <rect class="water" x="8" y="56.8" width="44" height="99.2" rx="2" />
            <rect class="wall" x="6" y="10" width="48" height="150" rx="5" />
          </svg>
        </div>
        <div
          class="glass"
          data-axis="water"
          data-glass="4"
          role="slider"
          tabindex="0"
          aria-label="Glass 5"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="63"
        >
          <svg class="glass-art" viewBox="0 0 60 170" aria-hidden="true" focusable="false">
            <rect class="water" x="8" y="68.5" width="44" height="87.5" rx="2" />
            <rect class="wall" x="6" y="10" width="48" height="150" rx="5" />
          </svg>
        </div>
        <div
          class="glass"
          data-axis="water"
          data-glass="5"
          role="slider"
          tabindex="0"
          aria-label="Glass 6"
          aria-valuemin="0"
          aria-valuemax="100"

          <svg class="glass-art" viewBox="0 0 60 170" aria-hidden="true" focusable="false">
            <rect class="water" x="8" y="86" width="44" height="70" rx="2" />
            <rect class="wall" x="6" y="10" width="48" height="150" rx="5" />
          </svg>
        </div>
        <div
          class="glass"
          data-axis="water"
          data-glass="6"
          role="slider"
          tabindex="0"
          aria-label="Glass 7"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="42"
        >
          <svg class="glass-art" viewBox="0 0 60 170" aria-hidden="true" focusable="false">
            <rect class="water" x="8" y="97.7" width="44" height="58.3" rx="2" />
            <rect class="wall" x="6" y="10" width="48" height="150" rx="5" />
          </svg>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
