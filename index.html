    <!--
      Gradients live once, here, and every glass points at them by id. A glass
      only looks like glass because of what light does to it, and a flat fill
      is the whole reason the first draft read as a bar chart.
    -->
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <!--
          Real water is barely a colour at all --- it's whatever it's sitting
          in front of, tinted faintly. The old fill (#8df0ff to #0a5f88, fully
          opaque) read as coloured glass, not water, and clashed hard with a
          warm photo behind it. This one carries partial opacity so the warm
          background bleeds through, the way it would through an actual glass.
        -->
        <linearGradient id="water-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fbeedb" stop-opacity="0.4" />
          <stop offset="45%" stop-color="#e9cd9c" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#c8a273" stop-opacity="0.48" />
        </linearGradient>
        <!--
          Two separate, narrow streaks read as curved glass catching light. One
          rect the width of the whole wall, even with soft stops, is still a
          hard-edged rectangle over straight sides --- which is what read as a
          graduated cylinder rather than a glass.
        -->
        <linearGradient id="highlight-bright" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="highlight-dim" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="bloom-fill">
          <stop offset="0%" stop-color="#ffe9c4" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#ffe9c4" stop-opacity="0" />
        </radialGradient>
        <!--
          A short, wide tumbler with a gentle outward curve to the wall ---
          straight sides read as a graduated cylinder, and the previous tall
          taper read as a lab flute ("矮一点、稍微宽一点，有一点弧度的圆弧形").
          Water, its waterline and the highlights all clip to this, so nothing
          hand-set in a single glass block can draw itself outside the curve.
        -->
        <clipPath id="vessel-clip">
          <path d="M10 14 C4 45 4 82 16 112 A19 5 0 0 0 54 112 C66 82 66 45 60 14 Z" />
        </clipPath>
      </defs>
    </svg>

        reasons. A slow or failed load otherwise leaves a blank page with nothing
        to touch, and the spec's checks read the SHIPPED markup, not the DOM after

        keys are already the right keys and a screen reader already announces the
        right thing. The water heights below are the tuned starting set --- an

        defaultWaterLevels() so this no-script state can't drift into a lie.
